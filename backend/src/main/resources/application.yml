spring:
  application:
    name: business-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/business_platform}
    username: ${DB_USERNAME:business}
    password: ${DB_PASSWORD:business}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
    expiration-minutes: 60
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
