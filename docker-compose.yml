services:
  postgres:
    image: postgres:17-alpine
    container_name: business-platform-postgres
    environment:
      POSTGRES_DB: business_platform
      POSTGRES_USER: business
      POSTGRES_PASSWORD: business
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business -d business_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: business-platform-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/business_platform
      DB_USERNAME: business
      DB_PASSWORD: business
      JWT_SECRET: change-this-secret-to-a-long-random-value-at-least-32-bytes
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: business-platform-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
